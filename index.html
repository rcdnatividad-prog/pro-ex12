<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>PRO-EX</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f7b5f">
<meta name="application-name" content="PRO-EX">
<meta name="apple-mobile-web-app-title" content="PRO-EX">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--em:#0f7b5f;--kh:#c3b091;--br:#7a4a21;--ye:#f2b705;--gr:#8a8d91;--bg:#faf5e4;--card:#fffdf6;--tx:#3b2a18;--bd:#e6dcc0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1812;--card:#26221a;--tx:#f3ecd6;--bd:#3a3326}}
:root[data-theme="dark"]{--bg:#1b1812;--card:#26221a;--tx:#f3ecd6;--bd:#3a3326}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100%}
.wrap{max-width:480px;margin:0 auto;padding:16px 16px 90px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:14px}
h1,h2,h3{margin:0 0 8px}h2{font-size:18px;color:var(--em)}h3{font-size:15px;color:var(--br)}
label{display:block;font-size:13px;color:var(--gr);margin:10px 0 4px}
input,select{width:100%;padding:12px;border:1px solid var(--kh);border-radius:10px;background:var(--bg);color:var(--tx);font-size:16px}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:12px 16px;background:var(--em);color:#fff;font-weight:600;width:100%;margin-top:12px}
button.alt{background:var(--ye);color:#3b2a18}button.ghost{background:transparent;color:var(--br);border:1px solid var(--kh);width:auto;margin:0;padding:6px 12px;font-size:13px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}.top .t{flex:1}.top b{font-size:20px;color:var(--em)}.top small{display:block;color:var(--gr)}
.badge{font-size:11px;padding:3px 8px;border-radius:99px;background:var(--em);color:#fff}.badge.off{background:var(--gr)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;margin:0;border-radius:0;background:none;color:var(--gr);padding:14px 4px}nav button.on{color:var(--em);box-shadow:inset 0 3px var(--em)}
.big{font-size:34px;font-weight:800;color:var(--em)}.row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px dashed var(--bd);gap:8px}
.bar{height:12px;background:var(--bd);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--em),var(--ye))}
.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin-top:10px}.grid span{aspect-ratio:1;border-radius:5px;background:var(--bd);font-size:9px;display:flex;align-items:center;justify-content:center;color:var(--gr)}.grid .d{background:var(--em);color:#fff}.grid .t{outline:2px solid var(--ye)}
.quote{background:var(--em);color:#fff;border-radius:16px;padding:14px;margin-bottom:14px;font-size:14px}
.tabs{display:flex;gap:8px;margin-bottom:8px}.tabs button{margin:0;background:var(--bd);color:var(--tx)}.tabs button.on{background:var(--em);color:#fff}
.err{color:#b3261e;font-size:13px;margin-top:8px;min-height:16px}.x{background:none;color:var(--gr);width:auto;margin:0;padding:2px 8px}
.mut{color:var(--gr);font-size:13px}
</style></head><body><div class="wrap" id="app"></div>
<script>
var LOGO='<svg viewBox="0 0 100 100" width="__S__" height="__S__"><rect x="4" y="6" width="92" height="90" rx="14" fill="#faf5e4" stroke="#7a4a21" stroke-width="2"/><rect x="12" y="14" width="76" height="76" rx="6" fill="#7a4a21"/><rect x="17" y="19" width="66" height="66" fill="#fffdf6"/><rect x="36" y="6" width="28" height="14" rx="4" fill="#8a8d91" stroke="#3b2a18"/><rect x="24" y="28" width="10" height="10" fill="none" stroke="#3b2a18" stroke-width="2"/><rect x="24" y="44" width="10" height="10" fill="none" stroke="#3b2a18" stroke-width="2"/><path d="M40 35h38M40 51h38" stroke="#3b2a18" stroke-width="2"/><path d="M60 60l12-6 5 2-12 7z" fill="#5aa02c"/><rect x="58" y="62" width="22" height="18" rx="3" fill="#c3b091" stroke="#3b2a18" stroke-width="1.5"/><circle cx="76" cy="71" r="2" fill="#f2b705"/><rect x="24" y="64" width="16" height="16" rx="8" fill="#f2b705" stroke="#3b2a18" stroke-width="1.5"/><circle cx="46" cy="72" r="8" fill="#f2b705" stroke="#3b2a18" stroke-width="1.5"/><text x="32" y="76" font-size="10" font-weight="700" text-anchor="middle" fill="#3b2a18">P</text><text x="46" y="75" font-size="8" font-weight="700" text-anchor="middle" fill="#3b2a18">P</text></svg>';
var logo=function(s){return LOGO.replace(/__S__/g,s)};
var Q=["Small savings every day build big futures.","Don't procrastinate your expenses, plan them!","Every peso saved today is freedom tomorrow.","Consistency beats amount. Save a little, daily.","Future you says thank you.","Skip one impulse buy today. Your goal gets closer.","Progress, not perfection. Keep the streak alive!"];
var SPLIT=[["🍱 Food",.5],["🚌 Transport",.25],["📚 School needs",.15],["🎈 Wants / treats",.1]];
var $=function(id){return document.getElementById(id)};
var esc=function(s){return String(s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})};
var peso=function(n){return "₱"+(Math.round(n*100)/100).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})};
var today=function(){var d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
var addDays=function(s,n){var d=new Date(s+"T00:00:00Z");d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)};
function ls(k,v){try{if(v===undefined){var r=localStorage.getItem(k);return r?JSON.parse(r):null}localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return null}}
var mem={users:{}};
var users=function(){return ls("proex_users")||mem.users};
var hash=function(s){var h=5381;for(var i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return String(h)};
var U=null,D=null,tab="today",mode="login",err="",editing=false;
function save(){ls("proex_v2_"+U.email,D)}
function boot(){var e=ls("proex_session");var us=users();if(e&&us[e]){U=us[e];D=ls("proex_v2_"+e);if(!D||!D.days)D={goal:null,days:{}}}render()}
window.addEventListener("online",render);window.addEventListener("offline",render);
function setMode(m){mode=m;err="";render()}
function fail(m){err=m;$("err").textContent=m}
function signup(){var n=$("n").value.trim(),e=$("e").value.trim().toLowerCase(),p=$("p").value;
 if(!n)return fail("Please enter your name.");if(!/^\S+@\S+\.\S+$/.test(e))return fail("Enter a valid email.");
 if(p.length!==6)return fail("Password must be exactly 6 characters.");
 var us=users();if(us[e])return fail("Email already registered. Please log in.");
 us[e]={name:n,email:e,pw:hash(p)};if(!ls("proex_users",us))mem.users=us;ls("proex_session",e);boot()}
function login(){var e=$("e").value.trim().toLowerCase(),p=$("p").value,u=users()[e];
 if(!u||u.pw!==hash(p))return fail("Wrong email or password.");ls("proex_session",e);boot()}
function logout(){ls("proex_session","");U=null;D=null;mode="login";tab="today";render()}
function go(t){tab=t;render()}
function genDay(){var td=today(),al=+$("al").value,sv=+$("sv").value;
 if(!(al>0))return alert("Enter your allowance for today.");if(!(sv>=0)||sv>al)return alert("Savings must be between 0 and your allowance.");
 var t=D.days[td]||{exp:[],done:false};t.allow=al;t.save=sv;D.days[td]=t;
 if(!D.goal)D.goal={ds:sv||1,days:+$("dur").value,start:td};editing=false;save();render()}
function addExp(){var td=today(),l=$("el").value.trim()||"Expense",a=+$("ea").value;if(!(a>0))return;D.days[td].exp.push({l:l,a:a,id:Date.now()});save();render()}
function delExp(id){var t=D.days[today()];t.exp=t.exp.filter(function(x){return x.id!==id});save();render()}
function toggleDone(){var t=D.days[today()];t.done=!t.done;save();render()}
function addLeft(l){var t=D.days[today()];t.save+=l;save();render()}
function edit(){editing=true;render()}
function setGoal(){var ds=+$("gds").value;if(!(ds>0))return;D.goal.ds=ds;D.goal.days=+$("gdur").value;save();render()}
function restart(){if(confirm("Restart your challenge from today? Your daily history is kept.")){D.goal.start=today();save();render()}}
function spent(t){return t.exp.reduce(function(s,x){return s+x.a},0)}
function streak(){var s=0,d=today(),has=function(x){return D.days[x]&&D.days[x].done};if(!has(d))d=addDays(d,-1);while(has(d)){s++;d=addDays(d,-1)}return s}
function render(){var A=$("app");
 if(!U){A.innerHTML='<div style="text-align:center;margin:30px 0 20px">'+logo(110)+'<h1 style="color:var(--em);margin-top:8px">Pro Ex</h1><div class="mut">PROcastinating EXpenditures</div></div><div class="card"><div class="tabs"><button class="'+(mode=="login"?"on":"")+'" onclick="setMode(\'login\')">Log in</button><button class="'+(mode=="signup"?"on":"")+'" onclick="setMode(\'signup\')">Sign up</button></div>'+
 (mode=="signup"?'<label>Name</label><input id="n" autocomplete="name">':"")+'<label>Email</label><input id="e" type="email" autocomplete="email"><label>Password (6 characters)</label><input id="p" type="password" maxlength="6" autocomplete="current-password"><div class="err" id="err">'+esc(err)+'</div><button onclick="'+(mode=="signup"?"signup()":"login()")+'">'+(mode=="signup"?"Create account":"Log in")+'</button><p class="mut" style="text-align:center">Works offline. Accounts are saved on this device.</p></div>';return}
 var on=navigator.onLine,td=today(),t=D.days[td],G=D.goal,h='<div class="top">'+logo(44)+'<div class="t"><b>Pro Ex</b><small>Hi, '+esc(U.name)+'</small></div><span class="badge '+(on?"":"off")+'">'+(on?"Online":"Offline")+'</span><button class="ghost" onclick="logout()">Log out</button></div>';
 var dl=new Date().toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"});
 if(tab=="today"){
  if(!t||editing){h+='<div class="card"><h2>Plan your day</h2><div class="mut">'+dl+(t?"":" · Open Pro Ex every day to plan a new budget")+'</div><label>Allowance for today (₱)</label><input id="al" type="number" inputmode="decimal" value="'+(t?t.allow:"")+'"><label>Savings for today (₱)</label><input id="sv" type="number" inputmode="decimal" value="'+(t?t.save:(G?G.ds:""))+'">'+(G?"":'<label>Savings challenge length</label><select id="dur"><option value="30">1 month (30 days)</option><option value="70">10 weeks (70 days)</option></select>')+'<button onclick="genDay()">Generate budget plan</button></div>'}
  else{var sp=spent(t),b=t.allow-t.save,left=b-sp;
   h+='<div class="card"><h2>Today\'s budget · '+dl+'</h2><div class="mut">You can spend</div><div class="big">'+peso(b)+'</div><div class="row"><span>Allowance</span><b>'+peso(t.allow)+'</b></div><div class="row"><span>Savings</span><b style="color:var(--em)">'+peso(t.save)+'</b></div><h3 style="margin-top:12px">Suggested split</h3>'+SPLIT.map(function(s){return '<div class="row"><span>'+s[0]+'</span><b>'+peso(b*s[1])+'</b></div>'}).join("")+'<button class="ghost" style="margin-top:12px" onclick="edit()">Change allowance / savings</button></div>'+
   '<div class="card"><div class="mut">Left to spend today</div><div class="big" style="color:'+(left<0?"#b3261e":"var(--em)")+'">'+peso(left)+'</div><div class="bar"><i style="width:'+Math.min(100,b?sp/b*100:100)+'%"></i></div><div class="mut" style="margin-top:6px">Spent '+peso(sp)+' of '+peso(b)+'</div>'+(left<0?'<p class="err">Over budget! Skip the next purchase.</p>':"")+(left>0&&sp>0?'<button class="alt" onclick="addLeft('+left+')">Save my leftover '+peso(left)+' too</button>':"")+'<button onclick="toggleDone()" style="'+(t.done?"background:var(--br)":"")+'">'+(t.done?"✓ Savings set aside (tap to undo)":"I set aside today\'s savings")+'</button></div>'+
   '<div class="card"><h3>Add expense</h3><input id="el" placeholder="What for? (e.g. Lunch)"><label>Amount (₱)</label><input id="ea" type="number" inputmode="decimal"><button class="alt" onclick="addExp()">Add expense</button></div><div class="card"><h3>Today\'s expenses</h3>'+(t.exp.length?t.exp.map(function(x){return '<div class="row"><span>'+esc(x.l)+'</span><span>'+peso(x.a)+'<button class="x" onclick="delExp('+x.id+')">✕</button></span></div>'}).join(""):'<div class="mut">Nothing spent yet. Nice!</div>')+'</div>'}}
 if(tab=="goal"){if(!G){h+='<div class="card">Make your first daily plan on the Today tab to start your savings challenge.</div>'}else{
  var keys=Object.keys(D.days).sort().reverse(),tot=keys.reduce(function(s,k){return s+(D.days[k].done?D.days[k].save:0)},0),tg=G.ds*G.days,pc=Math.min(100,tot/tg*100),cells="";
  for(var i=0;i<G.days;i++){var d=addDays(G.start,i);cells+='<span class="'+(D.days[d]&&D.days[d].done?"d ":"")+(d==td?"t":"")+'">'+(i+1)+'</span>'}
  var di=Math.floor((new Date(td)-new Date(G.start))/864e5)+1;
  h+='<div class="quote">💡 '+Q[new Date().getDate()%Q.length]+'</div><div class="card"><h2>Savings goal</h2><div class="mut">Saved so far</div><div class="big">'+peso(tot)+'</div><div class="bar"><i style="width:'+pc+'%"></i></div><div class="mut" style="margin-top:6px">'+Math.round(pc)+'% of '+peso(tg)+' · Day '+Math.max(1,Math.min(di,G.days))+' of '+G.days+' · 🔥 '+streak()+'-day streak</div><div class="grid">'+cells+'</div></div>'+
  '<div class="card"><h3>Challenge settings</h3><label>Daily saving target (₱)</label><input id="gds" type="number" inputmode="decimal" value="'+G.ds+'"><label>Length</label><select id="gdur"><option value="30"'+(G.days==30?" selected":"")+'>1 month (30 days)</option><option value="70"'+(G.days==70?" selected":"")+'>10 weeks (70 days)</option></select><button onclick="setGoal()">Update goal</button><button class="ghost" style="margin-top:12px" onclick="restart()">Restart challenge</button></div>'+
  '<div class="card"><h3>Daily history</h3>'+keys.map(function(k){var x=D.days[k];return '<div class="row"><span>'+k+'<br><span class="mut">Allowance '+peso(x.allow)+' · Spent '+peso(spent(x))+'</span></span><b style="color:'+(x.done?"var(--em)":"var(--gr)")+'">'+(x.done?"✓ ":"")+peso(x.save)+'</b></div>'}).join("")+'</div>'}}
 h+='<nav><button class="'+(tab=="today"?"on":"")+'" onclick="go(\'today\')">📋<br>Today</button><button class="'+(tab=="goal"?"on":"")+'" onclick="go(\'goal\')">🪙<br>Savings</button></nav>';
 A.innerHTML=h}
boot();
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}
</script></body></html>
